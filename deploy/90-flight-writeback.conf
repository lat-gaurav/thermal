# /etc/sysctl.d/90-flight-writeback.conf -- install:
#   sudo cp deploy/90-flight-writeback.conf /etc/sysctl.d/ && sudo sysctl --system
#
# Keep the kernel from hoarding written data in RAM and then flushing it in one
# burst. With the defaults (10% / 20% of 7.9 GB) up to ~650 MB piled up and the
# flush blocked every write for 5.5-8.3 s, every ~48 s, on the SD card
# (tools/disk_soak.py, 2026-10-29, T8a/T8b). With these limits data trickles out
# continuously: longest write block 246 ms, recorder queue peak 6 frames (T9).
# Applies to every file (rawrec, CSV, journal); none of them write anywhere near
# 32 MB/s, so nothing that matters is slowed down.
vm.dirty_background_bytes = 33554432
vm.dirty_bytes = 134217728
