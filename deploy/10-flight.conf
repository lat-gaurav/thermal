# Unattended-flight hardening. A drop-in, so the base unit stays as authored.
[Service]
# The pipeline must not lose the CPU to journald, an apt timer or an ssh login
# mid-sortie. Nice only -- deliberately NOT SCHED_FIFO, which on a 4-core box
# risks starving the kernel threads that feed the USB camera, i.e. it would
# protect the pipeline by starving its input.
Nice=-10
IOSchedulingClass=best-effort
IOSchedulingPriority=0

# Raw recording is ~118 GB/hour at 25 fps. --raw-reserve-mb is the backstop that
# stops the card filling; it is not a substitute for clearing logs between
# sorties. The CSV is tiny by comparison and is not pruned.
